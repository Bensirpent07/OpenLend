name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OpenLend.slnx

      - name: Build
        run: dotnet build OpenLend.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenLend.slnx --configuration Release --no-build