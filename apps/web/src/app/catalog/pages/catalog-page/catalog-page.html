
<app-page-header
  pageTitle="Catalog"
  description="Manage and view items in the catalog."
>
  <button
    pButton
    (click)="createDialogVisible.set(true)">
    <svg lucidePlus [size]="16"></svg>
    Add Equipment
  </button>
</app-page-header>

<app-table-wrapper
  (refreshRequested)="refreshCatalog()"
  (clearRequested)="clearFilters(catalogTable)"
>
  <p-table
    #catalogTable
    [value]="items()"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    [paginator]="true"
    [rows]="20"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    (onLazyLoad)="loadCatalog($event)"
    sortMode="multiple"
    [multiSortMeta]="[{ field: 'name', order: 1 }]"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="name">
          <div class="flex items-center">
            <span class="me-3">Name</span>
            <p-column-filter
              type="text"
              field="name"
              display="menu"
              matchMode="contains"
              [maxConstraints]="1"
              [showMatchModes]="false"
              [showOperator]="false"
              (keydown.space)="$event.stopPropagation()"
            />
            <p-sort-icon field="name" class="ms-auto" />
          </div>
        </th>
        <th pSortableColumn="description">
          <div class="flex items-center">
            <span class="me-3">Description</span>
            <p-column-filter
              type="text"
              field="description"
              display="menu"
              matchMode="contains"
              [maxConstraints]="1"
              [showMatchModes]="false"
              [showOperator]="false"
              (keydown.space)="$event.stopPropagation()"
            />
            <p-sort-icon field="description" class="ms-auto" />
          </div>
        </th>
        <th pSortableColumn="isActive">
          <div class="flex items-center">
            <span class="me-3">Status</span>
            <p-column-filter
              type="boolean"
              field="isActive"
              display="menu"
              matchMode="equals"
              [maxConstraints]="1"
              [showMatchModes]="false"
              [showOperator]="false"
            />
            <p-sort-icon field="isActive" class="ms-auto" />
          </div>
        </th>
      </tr>
    </ng-template>

    <ng-template #body let-item>
      <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.description ?? '—' }}</td>
        <td>{{ item.isActive ? 'Active' : 'Inactive' }}</td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="3">No catalog items found.</td>
      </tr>
    </ng-template>
  </p-table>
</app-table-wrapper>

<app-create-catalog-item-dialog
  [(visible)]="createDialogVisible"
  (created)="refreshCatalog()"
/>
