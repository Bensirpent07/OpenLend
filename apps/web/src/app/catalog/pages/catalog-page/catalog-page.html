
<div class="flex justify-end mb-4">
  <button
    pButton
    (click)="createDialogVisible.set(true)">
    Add Equipment
  </button>
</div>

<p-table
  [value]="items()"
  [lazy]="true"
  [paginator]="true"
  [rows]="20"
  [totalRecords]="totalRecords()"
  [loading]="loading()"
  (onLazyLoad)="loadCatalog($event)"
>
  <ng-template #header>
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Status</th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td>{{ item.name }}</td>
      <td>{{ item.description ?? '—' }}</td>
      <td>{{ item.isActive ? 'Active' : 'Inactive' }}</td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="3">No catalog items found.</td>
    </tr>
  </ng-template>
</p-table>

<app-create-catalog-item-dialog
  [(visible)]="createDialogVisible"
/>
