@let refreshFailure = refreshError();
<div class="overflow-hidden rounded-xl border border-surface bg-(--p-content-background)">
  <p-toolbar class="rounded-none! border-x-0! border-t-0!">
    <ng-template #start>
      <div [hidden]="!refreshFailure">
        <p-message severity="error" variant="simple" [attr.role]="refreshFailure ? 'alert' : null">
          <ng-template #icon>
            <svg lucideCircleAlert class="size-3.5 shrink-0" aria-hidden="true"></svg>
          </ng-template>
          <span class="font-medium">{{ refreshFailure }}</span>
          <span class="text-sm text-muted-color">
            Showing the last loaded results.
          </span>
        </p-message>
      </div>
      @if (!refreshFailure && multiSortEnabled()) {
        <div class="flex items-center gap-2 text-sm text-muted-color">
          <svg lucideInfo class="size-3.5 shrink-0" aria-hidden="true"></svg>
          <span>
            <kbd class="inline-flex items-center rounded border border-surface bg-emphasis px-1.5 align-middle font-mono text-xs text-color">Ctrl</kbd>
            /
            <kbd class="inline-flex items-center gap-1 rounded border border-surface bg-emphasis px-1.5 align-middle font-mono text-xs text-color">
              <svg lucideCommand class="size-3 shrink-0" aria-hidden="true"></svg>
              Command
            </kbd>
            + click a header to add it to the sort.
          </span>
        </div>
      }
    </ng-template>
    <ng-template #end>
      <button
        pButton
        size="small"
        (click)="clearRequested.emit()"
        aria-label="Clear filters"
        severity="secondary"
        class="me-2"
      >
        <svg lucideX class="size-4"></svg>
        Clear filters
      </button>
      <button
        pButton
        type="button"
        [iconOnly]="!refreshFailure"
        size="small"
        (click)="refreshRequested.emit()"
        [attr.aria-label]="refreshFailure ? null : 'Refresh table'"
        severity="secondary"
        pTooltip="Refresh table"
        [tooltipDisabled]="!!refreshFailure"
        tooltipPosition="top"
      >
        <svg lucideRefreshCw class="size-4" aria-hidden="true"></svg>
        @if (refreshFailure) {
          Retry
        }
      </button>
    </ng-template>
  </p-toolbar>
  <ng-content />
</div>
