<div class="overflow-hidden rounded-xl border border-surface bg-(--p-content-background)">
  <p-toolbar class="rounded-none! border-x-0! border-t-0!">
    <ng-template #start>
      @if (multiSortEnabled()) {
        <div class="flex items-center gap-2 text-sm text-muted-color">
          <svg lucideInfo class="size-3.5 shrink-0" aria-hidden="true"></svg>
          <span>
            <kbd class="inline-flex items-center rounded border border-surface bg-emphasis px-1.5 align-middle font-mono text-xs text-color">Ctrl</kbd>
            /
            <kbd class="inline-flex items-center gap-1 rounded border border-surface bg-emphasis px-1.5 align-middle font-mono text-xs text-color">
              <svg lucideCommand class="size-3 shrink-0" aria-hidden="true"></svg>
              Command
            </kbd>
            + click a header to add it to the sort.
          </span>
        </div>
      }
    </ng-template>
    <ng-template #end>
      <button
        pButton
        size="small"
        (click)="clearRequested.emit()"
        aria-label="Clear filters"
        severity="secondary"
        class="me-2"
      >
        <svg lucideX class="size-4"></svg>
        Clear filters
      </button>
      <button
        pButton
        iconOnly
        size="small"
        (click)="refreshRequested.emit()"
        aria-label="Refresh table"
        severity="secondary"
        pTooltip="Refresh table"
        tooltipPosition="top"
      >
        <svg lucideRefreshCw class="size-4"></svg>
      </button>
    </ng-template>
  </p-toolbar>
  <ng-content />
</div>
